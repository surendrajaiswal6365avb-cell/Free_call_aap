<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Free Call App</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0f172a;color:white;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{padding:15px;text-align:center;background:#1e293b}
.my-id{font-size:32px;font-weight:bold;letter-spacing:3px;color:#22c55e;margin:10px 0}
.status{font-size:14px;color:#94a3b8}
.dialer{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px}
.input-box{display:flex;gap:10px;margin-bottom:25px}
#callId{flex:1;padding:18px;font-size:22px;border-radius:12px;border:none;text-align:center;letter-spacing:2px;outline:none;background:#1e293b;color:white}
.btn-call{padding:18px 25px;background:#22c55e;color:black;font-weight:bold;border:none;border-radius:12px;font-size:18px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.key{padding:20px;background:#1e293b;border-radius:12px;text-align:center;font-size:24px;font-weight:bold}
.key:active{background:#334155}
.call-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.call-screen.active{display:flex}
.avatar{width:120px;height:120px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:20px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.btn-hang{margin-top:40px;padding:18px 50px;background:#ef4444;border:none;border-radius:50px;color:white;font-size:20px;font-weight:bold}
.btn-ans{padding:18px 50px;background:#22c55e;border:none;border-radius:50px;color:black;font-size:20px;font-weight:bold;margin:10px}
#incomingBox{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:25px;border-radius:25px 25px 0 0;z-index:200;display:none;text-align:center;transform:translateY(100%);transition:0.3s}
#incomingBox.show{display:block;transform:translateY(0)}
</style>
</head>
<body>
<div class="header">
<div style="font-size:14px;opacity:0.7">TUMHARA NUMBER</div>
<div class="my-id" id="myIdDisplay">.....</div>
<div class="status" id="statusText">Connecting...</div>
</div>
<div class="dialer">
<div class="input-box">
<input id="callId" type="number" placeholder="Number dalo">
<button class="btn-call" onclick="makeCall()">CALL</button>
</div>
<div class="keypad" id="keypad"></div>
</div>

<div class="call-screen" id="callScreen">
<div class="avatar">📞</div>
<h2 id="callStatusText">Calling...</h2>
<p id="callIdText" style="color:#94a3b8;margin-top:10px"></p>
<audio id="remoteAudio" autoplay playsinline></audio>
<button class="btn-hang" onclick="endCall()">Kaat Do</button>
</div>

<div id="incomingBox">
<h3 style="margin-bottom:5px">Incoming Call...</h3>
<h1 id="callerId" style="font-size:32px;color:#22c55e;margin:10px 0"></h1>
<div style="display:flex;justify-content:center;gap:20px;margin-top:20px">
<button class="btn-hang" onclick="rejectCall()" style="margin:0;padding:15px 30px">Kaat Do</button>
<button class="btn-ans" onclick="answerCall()">Uthao</button>
</div>
<audio id="incomingRing" loop src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_3a0a5e7f8c.mp3?filename=phone-ringing-101147.mp3"></audio>
</div>

<script>
let peer, currentCall, localStream;
const myId = Math.floor(100000 + Math.random()*900000).toString();

peer = new Peer(myId, {
  config: { 'iceServers': [ { 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }, { 'urls': 'turn:openrelay.metered.ca:80', 'username': 'openrelayproject', 'credential': 'openrelayproject' }, { 'urls': 'turn:openrelay.metered.ca:443', 'username': 'openrelayproject', 'credential': 'openrelayproject' } ] }
});

peer.on('open', id => {
  document.getElementById('myIdDisplay').innerText = id;
  document.getElementById('statusText').innerText = 'Online - Call ke liye ready';
});

peer.on('error', err => {
  document.getElementById('statusText').innerText = err.type;
});

peer.on('call', call => {
  currentCall = call;
  document.getElementById('callerId').innerText = call.peer;
  document.getElementById('incomingBox').classList.add('show');
  document.getElementById('incomingRing').play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([500,300,500]);
});

async function getMic(){
  if(localStream) return localStream;
  localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false});
  return localStream;
}

async function makeCall(){
  const id = document.getElementById('callId').value.trim();
  if(!id || id.length < 5){ alert('Sahi number dalo'); return; }
  try{
    const stream = await getMic();
    document.getElementById('callScreen').classList.add('active');
    document.getElementById('callIdText').innerText = id;
    document.getElementById('callStatusText').innerText = 'Ringing...';
    const call = peer.call(id, stream);
    currentCall = call;
    setupCallEvents(call);
  }catch(e){ alert('Mic allow karo: '+e.message); }
}

async function answerCall(){
  try{
    document.getElementById('incomingBox').classList.remove('show');
    document.getElementById('incomingRing').pause();
    const stream = await getMic();
    currentCall.answer(stream);
    document.getElementById('callScreen').classList.add('active');
    document.getElementById('callIdText').innerText = currentCall.peer;
    document.getElementById('callStatusText').innerText = 'Connecting...';
    setupCallEvents(currentCall);
  }catch(e){ alert('Mic Error: '+e.message); }
}

function setupCallEvents(call){
  call.on('stream', remoteStream => {
    const audio = document.getElementById('remoteAudio');
    audio.srcObject = remoteStream;
    audio.play().catch(()=>{});
    document.getElementById('callStatusText').innerText = 'Connected';
  });
  call.on('close', () => endCall());
  call.on('error', () => endCall());
}

function endCall(){
  if(currentCall) currentCall.close();
  document.getElementById('callScreen').classList.remove('active');
  document.getElementById('incomingBox').classList.remove('show');
  document.getElementById('incomingRing').pause();
  currentCall = null;
  if(navigator.vibrate) navigator.vibrate(0);
}

function rejectCall(){
  if(currentCall) currentCall.close();
  document.getElementById('incomingBox').classList.remove('show');
  document.getElementById('incomingRing').pause();
}

const kp = document.getElementById('keypad');
for(let i=1;i<=9;i++){
  const d = document.createElement('div'); d.className='key'; d.innerText=i;
  d.onclick=()=>document.getElementById('callId').value+=i; kp.appendChild(d);
}
const star = document.createElement('div'); star.className='key'; star.innerText='*'; star.onclick=()=>document.getElementById('callId').value+='*'; kp.appendChild(star);
const zero = document.createElement('div'); zero.className='key'; zero.innerText='0'; zero.onclick=()=>document.getElementById('callId').value+='0'; kp.appendChild(zero);
const hash = document.createElement('div'); hash.className='key'; hash.innerText='⌫'; hash.onclick=()=>{let e=document.getElementById('callId'); e.value=e.value.slice(0,-1)}; kp.appendChild(hash);
</script>
</body>
       </html>
