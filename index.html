<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<title>Free Call - Final</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#070d1a;color:white;min-height:100vh;display:flex;flex-direction:column}
.header{padding:14px;background:#0f1a2e;text-align:center;border-bottom:1px solid #1c2d4d}
.my-id{font-size:28px;font-weight:900;color:#22c55e;letter-spacing:3px}
.st{font-size:10px;color:#22c55e;background:#102216;padding:4px 12px;border-radius:20px;margin-top:6px;display:inline-block;border:1px solid #1a3d1a}
.dialer{flex:1;padding:12px;max-width:400px;margin:0 auto;width:100%; padding-bottom: 75px;}
.disp{height:46px;background:#0f1a2e;border:1px solid #1c2d4d;border-radius:12px;display:flex;align-items:center;padding:0 12px;gap:8px}
#callId{flex:1;background:transparent;border:none;color:white;font-size:18px;outline:none}
.keypad{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:#0f1a2e;border:1px solid #1c2d4d;border-radius:14px;padding:14px 0;text-align:center}
.key:active{background:#1e3a5f}
.key b{font-size:20px}.key span{font-size:9px;color:#4a5d80;display:block;margin-top:2px}
.action{background:#0f1a2e;border:1px solid #1c2d4d;border-radius:16px;padding:12px;margin-top:12px;display:flex;justify-content:space-around}
.abtn{text-align:center}.abtn button{width:56px;height:56px;border-radius:50%;border:none;font-size:20px;transition:0.2s}
.b-call{background:#22c55e}.b-mic{background:#1c2d4d;color:white}.b-mic.muted{background:#ef4444!important}.b-spk{background:#1c2d4d;color:white}.b-spk.on{background:#22c55e!important;color:black!important}
.contacts{margin-top:14px;background:#0f1a2e;border:1px solid #1c2d4d;border-radius:14px;padding:12px}
.save-row{display:flex;gap:8px;margin-bottom:12px}
.save-row input{flex:1;background:#070d1a;border:1px solid #1c2d4d;border-radius:10px;padding:13px 12px;color:white;font-size:14px;outline:none}
.save-row input:focus{border-color:#22c55e}
.save-btn{background:#22c55e;border:none;border-radius:10px;padding:0 20px;font-weight:900;font-size:14px;color:black}
.contact-item{display:flex;align-items:center;justify-content:space-between;background:#070d1a;border:1px solid #1a2742;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.call-screen{position:fixed;inset:0;background:#070d1a;z-index:50;display:none;flex-direction:column;padding:20px}
.call-screen.active{display:flex}
#incomingBox{position:fixed;bottom:0;left:0;right:0;background:#0f1a2e;border-radius:24px 24px 0 0;padding:24px;display:none;z-index:60;text-align:center;border-top:1px solid #1c2d4d}
#incomingBox.show{display:block}
#customAlert{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#customAlert.show{display:flex}
.alert-box{background:#16213a;border:1px solid #243656;border-radius:18px;padding:22px;width:100%;max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="header">
<div style="font-size:9px;color:#4a5d80;letter-spacing:2px">TUMHARA FIX NUMBER</div>
<div class="my-id" id="myIdDisplay">......</div>
<div class="st" id="statusText">● Connecting...</div>
</div>
<div class="dialer">
<div class="disp"><input id="callId" type="tel" placeholder="Number dalo"><div onclick="document.getElementById('callId').value=document.getElementById('callId').value.slice(0,-1)" style="background:#1c2d4d;padding:6px 10px;border-radius:8px;font-size:14px">⌫</div></div>
<div class="keypad" id="keypad"></div>
<div class="action">
<div class="abtn"><button class="b-mic" id="hmic" onclick="toggleMute()">🎤</button><div style="font-size:10px;color:#5a7196;margin-top:4px">MIC</div></div>
<div class="abtn"><button class="b-call" onclick="makeCall()">📞</button><div style="font-size:10px;color:#22c55e;font-weight:700;margin-top:4px">CALL</div></div>
<div class="abtn"><button class="b-spk on" id="hspk" onclick="toggleSpeaker()">🔊</button><div style="font-size:10px;color:#5a7196;margin-top:4px">SPK</div></div>
</div>
<div class="contacts">
<h4 style="font-size:11px;color:#4a5d80;margin-bottom:10px;display:flex;justify-content:space-between"><span>📒 SAVED CONTACTS</span><span id="contactCount" style="color:#22c55e">0</span></h4>
<div class="save-row">
<input id="contactInput" placeholder="Papa 123456 (Naam + Number)">
<button class="save-btn" onclick="saveContact()">SAVE</button>
</div>
<div id="contactList"></div>
</div>
</div>
<div class="call-screen" id="callScreen">
<div style="text-align:center;margin-top:30px"><div id="callIdText" style="font-size:22px;font-weight:800"></div><div id="callTimer" style="font-family:monospace;color:#5a7196;font-size:18px;margin-top:6px">00:00</div><div id="callStatusText" style="margin-top:8px;font-size:11px;background:#102216;color:#22c55e;display:inline-block;padding:5px 14px;border-radius:20px">Calling...</div></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="outRing" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a3f4b5.mp3?filename=phone-ringing-101378.mp3"></audio>
<div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding-bottom:20px"><div style="display:flex;gap:28px"><button id="muteBtn" onclick="toggleMute()" style="width:60px;height:60px;border-radius:50%;border:none;background:#1c2d4d;color:white;font-size:22px">🎤</button><button id="speakerBtn" onclick="toggleSpeaker()" style="width:60px;height:60px;border-radius:50%;border:none;background:#22c55e;font-size:22px">🔊</button></div><button onclick="endCall()" style="width:72px;height:72px;border-radius:50%;background:#ef4444;border:none;font-size:28px">📵</button><div style="font-size:11px;color:#4a5d80">Call kaatne ke liye dabao</div></div>
</div>
<div id="incomingBox"><div style="font-size:12px;color:#5a7196">INCOMING CALL</div><div id="callerId" style="font-size:28px;color:#22c55e;font-weight:800;margin-top:6px"></div><div style="display:flex;justify-content:center;gap:60px;margin-top:24px"><button onclick="rejectCall()" style="width:64px;height:64px;border-radius:50%;background:#ef4444;border:none;font-size:24px">📵</button><button onclick="answerCall()" style="width:64px;height:64px;border-radius:50%;background:#22c55e;border:none;font-size:24px">📞</button></div><audio id="incomingRing" loop src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_3a0a5e7f8c.mp3?filename=phone-ringing-101147.mp3"></audio></div>
<div id="customAlert"><div class="alert-box"><h3 id="alertTitle" style="color:#22c55e;margin-bottom:8px"></h3><p id="alertMsg" style="color:#cbd5e1;font-size:13px;margin-bottom:18px"></p><button onclick="document.getElementById('customAlert').classList.remove('show')" style="background:#22c55e;color:black;border:none;padding:12px 24px;border-radius:12px;font-weight:800;width:100%">OK</button></div></div>
<script>
function showAlert(t,m){document.getElementById('alertTitle').innerText=t;document.getElementById('alertMsg').innerText=m;document.getElementById('customAlert').classList.add('show');}
let peer,currentCall,localStream,timerInt,sec=0,isMuted=false,isSpeaker=true;
let myId=localStorage.getItem('myPermanentCallId'); if(!myId){myId=Math.floor(100000+Math.random()*900000).toString(); localStorage.setItem('myPermanentCallId',myId);}
let contacts=JSON.parse(localStorage.getItem('myContacts')||'[]');
function renderContacts(){
  const list=document.getElementById('contactList');
  document.getElementById('contactCount').innerText=contacts.length;
  if(contacts.length===0){list.innerHTML='<div style="text-align:center;color:#2a3a5a;font-size:11px;padding:12px">Koi contact nahi - upar se save karo</div>';return;}
  list.innerHTML='';
  contacts.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='contact-item';
    d.innerHTML='<div><div style="font-size:14px;font-weight:600">'+c.name+'</div><div style="font-size:11px;color:#5a7196">'+c.number+'</div></div><div style="display:flex;gap:8px"><button style="background:#22c55e;border:none;border-radius:50%;width:36px;height:36px;font-size:16px" onclick="callContact(\''+c.number+'\')">📞</button><button style="background:#1c2d4d;color:#ef4444;border:none;border-radius:50%;width:36px;height:36px" onclick="deleteContact('+i+')">🗑️</button></div>';
    list.appendChild(d);
  });
}
function saveContact(){
  let val=document.getElementById('contactInput').value.trim();
  if(!val){ showAlert('Likho','Ex: Papa 805750'); return; }
  let parts=val.split(' ');
  let number=parts.pop();
  let name=parts.join(' ');
  if(!name){ name=number; number=document.getElementById('callId').value.trim(); }
  if(!number || number.length<3){ showAlert('Number Dalo','Sahi number dalo'); return; }
  contacts.push({name,number});
  localStorage.setItem('myContacts',JSON.stringify(contacts));
  document.getElementById('contactInput').value='';
  renderContacts();
  showAlert('Save ✅',name+' save ho gaya');
}
function deleteContact(i){contacts.splice(i,1); localStorage.setItem('myContacts',JSON.stringify(contacts)); renderContacts();}
function callContact(num){document.getElementById('callId').value=num; makeCall();}
renderContacts();
peer=new Peer(myId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}});
peer.on('open',id=>{document.getElementById('myIdDisplay').innerText=id;document.getElementById('statusText').innerText='● Online • Fix Number';});
peer.on('error',err=>{document.getElementById('outRing').pause(); if(err.type==='peer-unavailable'){showAlert('Galat Number ❌','Number galat hai ya offline hai'); endCall();}});
peer.on('call',call=>{currentCall=call; document.getElementById('callerId').innerText=call.peer; document.getElementById('incomingBox').classList.add('show'); document.getElementById('incomingRing').play().catch(()=>{});});
async function getMic(){if(localStream) return localStream; try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); return localStream;}catch(e){showAlert('Mic Block 🎤','Browser me Mic Allow karo'); throw e;}}
async function makeCall(){const id=document.getElementById('callId').value.trim(); if(!id){showAlert('Number Dalo','Pehle number dalo');return;} if(id===myId){showAlert('Apna Number','Apne number pe call nahi');return;} const s=await getMic(); document.getElementById('callScreen').classList.add('active'); document.getElementById('callIdText').innerText=id; document.getElementById('outRing').play().catch(()=>{}); const call=peer.call(id,s); currentCall=call; setupCall(call);}
async function answerCall(){document.getElementById('incomingBox').classList.remove('show'); document.getElementById('incomingRing').pause(); const s=await getMic(); currentCall.answer(s); document.getElementById('callScreen').classList.add('active'); document.getElementById('callIdText').innerText=currentCall.peer; setupCall(currentCall);}
function setupCall(call){call.on('stream',rs=>{document.getElementById('outRing').pause(); const a=document.getElementById('remoteAudio'); a.srcObject=rs; a.volume=isSpeaker?1:0.35; a.play().catch(()=>{}); document.getElementById('callStatusText').innerText='● Connected'; sec=0; clearInterval(timerInt); timerInt=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById('callTimer').innerText=m+':'+s;},1000);}); call.on('close',()=>endCall());}
function endCall(){
  if(currentCall) currentCall.close();
  document.getElementById('callScreen').classList.remove('active');
  document.getElementById('incomingBox').classList.remove('show');
  document.getElementById('incomingRing').pause();
  document.getElementById('outRing').pause();
  clearInterval(timerInt);
  document.getElementById('callTimer').innerText='00:00';
  if(sec > 5){
    document.getElementById('adOnCut').style.display='flex';
    setTimeout(()=>{ document.getElementById('adOnCut').style.display='none'; }, 6000);
  }
  }
function rejectCall(){if(currentCall) currentCall.close(); document.getElementById('incomingBox').classList.remove('show'); document.getElementById('incomingRing').pause();}
function toggleMute(){
  if(!localStream){ showAlert('Call Lagao','Pehle call lagao'); return; }
  isMuted=!isMuted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
  const icon=isMuted?'🔇':'🎤';
  document.getElementById('muteBtn').innerText=icon;
  document.getElementById('hmic').innerText=icon;
  document.getElementById('muteBtn').style.background=isMuted?'#ef4444':'#1c2d4d';
  document.getElementById('hmic').classList.toggle('muted',isMuted);
  document.getElementById('callStatusText').innerText=isMuted?'🔇 Muted':'● Connected';
}
function toggleSpeaker(){
  isSpeaker=!isSpeaker;
  const audio=document.getElementById('remoteAudio');
  audio.volume=isSpeaker?1:0.35;
  document.getElementById('hspk').classList.toggle('on',isSpeaker);
  document.getElementById('speakerBtn').style.background=isSpeaker?'#22c55e':'#1c2d4d';
  document.getElementById('speakerBtn').innerText=isSpeaker?'🔊':'🔈';
  document.getElementById('hspk').innerText=isSpeaker?'🔊':'🔈';
}
const kp=document.getElementById('keypad');
[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].forEach(k=>{
  const d=document.createElement('div'); d.className='key'; d.innerHTML='<b>'+k[0]+'</b><span>'+k[1]+'</span>';
  d.onclick=()=>{document.getElementById('callId').value+=k[0];};
  kp.appendChild(d);
});
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

  </div>
</div>

<div style="position:fixed; bottom:0; left:0; right:0; background:#0a1229; border-top:2px solid #00ff88; text-align:center; padding:4px 0; z-index:99999; height:62px;">
  <p style="color:#00ff88; font-size:9px; margin:0; letter-spacing:1px;">ADVERTISEMENT</p>

  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
</body>
