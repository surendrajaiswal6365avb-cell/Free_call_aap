<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<title>Free Call - Final</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1a;color:white;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
.header{padding:14px;background:#0f1a33;display:flex;justify-content:space-between;align-items:center}
.my-id{font-size:26px;font-weight:900;color:#22c55e;letter-spacing:1px}
.st{font-size:10px;color:#22c55e;background:#162a16;padding:3px 8px;border-radius:20px}
.dialer{flex:1;padding:12px;max-width:400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;justify-content:center}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #1e3a5f;background:#0f1a33;color:white;font-size:18px;text-align:center;outline:none}
.btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:18px;font-weight:800;cursor:pointer}
.btn-call{background:#22c55e;color:black}
.btn-end{background:#ef4444;color:white;display:none}
.status{text-align:center;color:#8aa0c8;font-size:13px;min-height:18px}
#remoteAudio{display:none}
</style>
</head>
<body>
<div class="header">
<div>
<div style="font-size:11px;color:#8aa0c8">Tumhari ID</div>
<div class="my-id" id="myId">805750...</div>
</div>
<div class="st" id="st">● Online</div>
</div>

<div class="dialer">
<div class="status" id="status">ID copy karke dusre ko bhejo, call karo</div>
<input type="text" id="peerIdInput" placeholder="Samne wale ki ID dalo">
<button class="btn btn-call" id="callBtn" onclick="startCall()">📞 Call Lagao</button>
<button class="btn btn-end" id="endBtn" onclick="endCall()">🔴 Call Kaato</button>
<div style="text-align:center;font-size:12px;color:#556b8e;margin-top:10px">GitHub se Free Call App</div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
let peer, currentCall;
const myIdEl = document.getElementById('myId');
const statusEl = document.getElementById('status');
const peerInput = document.getElementById('peerIdInput');
const callBtn = document.getElementById('callBtn');
const endBtn = document.getElementById('endBtn');

function init(){
  const myId = '805750' + Math.floor(100 + Math.random()*900);
  peer = new Peer(myId);
  peer.on('open', id => { myIdEl.innerText = id; myIdEl.onclick = ()=>{ navigator.clipboard.writeText(id); statusEl.innerText='ID Copy ho gayi!'; } });
  peer.on('call', async call => {
    statusEl.innerText = 'Call aa rahi hai...';
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    call.answer(stream);
    handleCall(call);
  });
  peer.on('error', e => { statusEl.innerText = 'Error: ' + e.type; });
}
async function startCall(){
  const toId = peerInput.value.trim();
  if(!toId){ statusEl.innerText='Pehle ID dalo bhai!'; return; }
  statusEl.innerText='Call laga rahe hain...';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const call = peer.call(toId, stream);
    handleCall(call);
  }catch(err){ statusEl.innerText='Mic ka permission do'; }
}
function handleCall(call){
  currentCall = call;
  callBtn.style.display='none';
  endBtn.style.display='block';
  statusEl.innerText='🔊 Call Connected - Baat karo';
  call.on('stream', remoteStream => { document.getElementById('remoteAudio').srcObject = remoteStream; });
  call.on('close', endCall);
  call.on('error', endCall);
}
function endCall(){
  if(currentCall) currentCall.close();
  currentCall=null;
  callBtn.style.display='block';
  endBtn.style.display='none';
  statusEl.innerText='Call khatam. Nayi ID dalo.';
}
init();
</script>
</body>
</html>
