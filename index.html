<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Call - Final</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#070d1a;color:white;min-height:100vh;display:flex;flex-direction:column}
.header{padding:14px;background:#0f1a2e;text-align:center;border-bottom:1px solid #1c2d4d}
.my-id{font-size:26px;font-weight:900;color:#22c55e;letter-spacing:3px}
.st{font-size:10px;color:#22c55e;background:#102216;padding:3px 10px;border-radius:20px;margin-top:5px;display:inline-block}
.dialer{flex:1;padding:12px;max-width:380px;margin:0 auto;width:100%}
.disp{height:40px;background:#0f1a2e;border:1px solid #1c2d4d;border-radius:10px;display:flex;align-items:center;padding:0 10px;gap:6px}
#callId{flex:1;background:transparent;border:none;color:white;font-size:16px;outline:none}
.keypad{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{background:#0f1a2e;border:1px solid #1c2d4d;border-radius:12px;padding:12px 0;text-align:center}
.key b{font-size:19px}.key span{font-size:8px;color:#4a5d80;display:block}
.action{background:#0f1a2e;border:1px solid #1c2d4d;border-radius:14px;padding:10px;margin-top:10px;display:flex;justify-content:space-around}
.abtn{text-align:center}.abtn button{width:52px;height:52px;border-radius:50%;border:none;font-size:19px}
.b-call{background:#22c55e}.b-mic{background:#1c2d4d;color:white}.b-mic.off{background:#ef4444}.b-spk.on{background:#22c55e;color:black}.b-spk{background:#1c2d4d;color:white}
.contacts{margin-top:14px;background:#0f1a2e;border:1px solid #1c2d4d;border-radius:12px;padding:10px}
.save-row{display:flex;gap:6px;margin-bottom:10px}
.save-row input{flex:1;background:#070d1a;border:1px solid #1c2d4d;border-radius:8px;padding:8px 10px;color:white;font-size:13px;outline:none}
.save-btn{background:#22c55e;border:none;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px}
.contact-item{display:flex;align-items:center;justify-content:space-between;background:#070d1a;border:1px solid #1a2742;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.c-actions{display:flex;gap:6px}.c-actions button{border:none;border-radius:50%;width:32px;height:32px}
.call-screen{position:fixed;inset:0;background:#070d1a;z-index:50;display:none;flex-direction:column;padding:20px}
.call-screen.active{display:flex}
#incomingBox{position:fixed;bottom:0;left:0;right:0;background:#0f1a2e;border-radius:24px 24px 0 0;padding:22px;display:none;z-index:60;text-align:center}
#incomingBox.show{display:block}
#customAlert{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#customAlert.show{display:flex}
.alert-box{background:#16213a;border:1px solid #243656;border-radius:18px;padding:20px;width:100%;max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="header">
<div style="font-size:8px;color:#4a5d80;letter-spacing:2px">TUMHARA FIX NUMBER - HAMESHA SAME</div>
<div class="my-id" id="myIdDisplay">......</div>
<div class="st" id="statusText">● Connecting...</div>
</div>
<div class="dialer">
<div class="disp"><input id="callId" type="tel" placeholder="Number dalo"><div onclick="document.getElementById('callId').value=document.getElementById('callId').value.slice(0,-1)" style="background:#1c2d4d;padding:4px 8px;border-radius:6px">⌫</div></div>
<div class="keypad" id="keypad"></div>
<div class="action">
<div class="abtn"><button class="b-mic" id="hmic" onclick="toggleMute()">🎤</button><label style="font-size:9px;color:#5a7196">MIC</label></div>
<div class="abtn"><button class="b-call" onclick="makeCall()">📞</button><label style="font-size:9px;color:#22c55e;font-weight:700">CALL</label></div>
<div class="abtn"><button class="b-spk on" id="hspk" onclick="toggleSpeaker()">🔊</button><label style="font-size:9px;color:#5a7196">SPK</label></div>
</div>
<div class="contacts">
<h4 style="font-size:11px;color:#4a5d80;margin-bottom:8px;display:flex;justify-content:space-between"><span>📒 SAVED CONTACTS</span><span id="contactCount" style="color:#22c55e">0</span></h4>
<div class="save-row"><input id="contactName" placeholder="Naam (Papa)"><input id="contactNumber" placeholder="Number" style="max-width:110px"><button class="save-btn" onclick="saveContact()">SAVE</button></div>
<div id="contactList"></div>
</div>
</div>
<div class="call-screen" id="callScreen">
<div style="text-align:center;margin-top:20px"><div id="callIdText" style="font-size:18px;font-weight:700"></div><div id="callTimer" style="font-family:monospace;color:#5a7196">00:00</div><div id="callStatusText" style="margin-top:6px;font-size:11px;background:#102216;color:#22c55e;display:inline-block;padding:3px 12px;border-radius:20px">Calling...</div></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<audio id="outRing" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a3f4b5.mp3?filename=phone-ringing-101378.mp3"></audio>
<div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:18px"><div style="display:flex;gap:22px"><button id="muteBtn" onclick="toggleMute()" style="width:54px;height:54px;border-radius:50%;border:none;background:#1c2d4d;color:white">🎤</button><button id="speakerBtn" onclick="toggleSpeaker()" style="width:54px;height:54px;border-radius:50%;border:none;background:#22c55e">🔊</button></div><button onclick="endCall()" style="width:64px;height:64px;border-radius:50%;background:#ef4444;border:none;font-size:26px">📵</button></div>
</div>
<div id="incomingBox"><div id="callerId" style="font-size:26px;color:#22c55e;font-weight:800"></div><div style="display:flex;justify-content:center;gap:50px;margin-top:20px"><button onclick="rejectCall()" style="width:60px;height:60px;border-radius:50%;background:#ef4444;border:none">📵</button><button onclick="answerCall()" style="width:60px;height:60px;border-radius:50%;background:#22c55e;border:none">📞</button></div><audio id="incomingRing" loop src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_3a0a5e7f8c.mp3?filename=phone-ringing-101147.mp3"></audio></div>
<div id="customAlert"><div class="alert-box"><h3 id="alertTitle" style="color:#22c55e;margin-bottom:8px"></h3><p id="alertMsg" style="color:#cbd5e1;font-size:13px;margin-bottom:16px"></p><button onclick="document.getElementById('customAlert').classList.remove('show')" style="background:#22c55e;color:black;border:none;padding:10px 24px;border-radius:10px;font-weight:700;width:100%">OK</button></div></div>
<script>
function showAlert(t,m){document.getElementById('alertTitle').innerText=t;document.getElementById('alertMsg').innerText=m;document.getElementById('customAlert').classList.add('show');}
let peer,currentCall,localStream,timerInt,sec=0,isMuted=false;
let myId=localStorage.getItem('myPermanentCallId'); if(!myId){myId=Math.floor(100000+Math.random()*900000).toString(); localStorage.setItem('myPermanentCallId',myId);}
let contacts=JSON.parse(localStorage.getItem('myContacts')||'[]');
function renderContacts(){const list=document.getElementById('contactList'); document.getElementById('contactCount').innerText=contacts.length; if(contacts.length===0){list.innerHTML='<div style="text-align:center;color:#2a3a5a;font-size:11px;padding:10px">Koi contact nahi</div>';return;} list.innerHTML=''; contacts.forEach((c,i)=>{const d=document.createElement('div'); d.className='contact-item'; d.style.display='flex'; d.style.justifyContent='space-between'; d.style.alignItems='center'; d.style.background='#070d1a'; d.style.padding='8px 10px'; d.style.borderRadius='10px'; d.style.marginBottom='6px'; d.innerHTML='<div><div style="font-size:13px;font-weight:600">'+c.name+'</div><div style="font-size:11px;color:#5a7196">'+c.number+'</div></div><div style="display:flex;gap:6px"><button style="background:#22c55e;border:none;border-radius:50%;width:32px;height:32px" onclick="callContact(\''+c.number+'\')">📞</button><button style="background:#1c2d4d;color:#ef4444;border:none;border-radius:50%;width:32px;height:32px" onclick="deleteContact('+i+')">🗑️</button></div>'; list.appendChild(d);});}
function saveContact(){const name=document.getElementById('contactName').value.trim(); let number=document.getElementById('contactNumber').value.trim() || document.getElementById('callId').value.trim(); if(!name){showAlert('Naam Likho','Naam likho jaise: Papa');return;} if(!number){showAlert('Number Dalo','Number dalo');return;} contacts.push({name,number}); localStorage.setItem('myContacts',JSON.stringify(contacts)); document.getElementById('contactName').value=''; document.getElementById('contactNumber').value=''; renderContacts(); showAlert('Save ✅',name+' save ho gaya');}
function deleteContact(i){contacts.splice(i,1); localStorage.setItem('myContacts',JSON.stringify(contacts)); renderContacts();}
function callContact(num){document.getElementById('callId').value=num; makeCall();}
renderContacts();
peer=new Peer(myId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}});
peer.on('open',id=>{document.getElementById('myIdDisplay').innerText=id;document.getElementById('statusText').innerText='● Online • Fix Number';});
peer.on('error',err=>{document.getElementById('outRing').pause(); if(err.type==='peer-unavailable'){showAlert('Galat Number ❌','Number galat hai ya offline hai'); endCall();}});
peer.on('call',call=>{currentCall=call; document.getElementById('callerId').innerText=call.peer; document.getElementById('incomingBox').classList.add('show'); document.getElementById('incomingRing').play().catch(()=>{});});
async function getMic(){if(localStream) return localStream; try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); return localStream;}catch(e){showAlert('Mic Block 🎤','Upar 🔒 pe click karke Mic Allow karo'); throw e;}}
async function makeCall(){const id=document.getElementById('callId').value.trim(); if(!id||id.length<4){showAlert('Number Dalo','Pehle number dalo');return;} if(id===myId){showAlert('Apna Number','Apne number pe call nahi');return;} const s=await getMic(); document.getElementById('callScreen').classList.add('active'); document.getElementById('callIdText').innerText=id; document.getElementById('outRing').play().catch(()=>{}); const call=peer.call(id,s); currentCall=call; setupCall(call);}
async function answerCall(){document.getElementById('incomingBox').classList.remove('show'); document.getElementById('incomingRing').pause(); const s=await getMic(); currentCall.answer(s); document.getElementById('callScreen').classList.add('active'); document.getElementById('callIdText').innerText=currentCall.peer; setupCall(currentCall);}
function setupCall(call){call.on('stream',rs=>{document.getElementById('outRing').pause(); const a=document.getElementById('remoteAudio'); a.srcObject=rs; a.volume=1; a.play().catch(()=>{}); document.getElementById('callStatusText').innerText='● Connected'; sec=0; clearInterval(timerInt); timerInt=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById('callTimer').innerText=m+':'+s;},1000);}); call.on('close',()=>endCall());}
function endCall(){if(currentCall) currentCall.close(); document.getElementById('callScreen').classList.remove('active'); document.getElementById('incomingBox').classList.remove('show'); document.getElementById('incomingRing').pause(); document.getElementById('outRing').pause(); clearInterval(timerInt); document.getElementById('callTimer').innerText='00:00';}
function rejectCall(){if(currentCall) currentCall.close(); document.getElementById('incomingBox').classList.remove('show'); document.getElementById('incomingRing').pause();}
function toggleMute(){if(!localStream){showAlert('Call Lagao','Pehle call lagao');return;} isMuted=!isMuted; localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); const ic=isMuted?'🔇':'🎤'; document.getElementById('muteBtn').innerText=ic; document.getElementById('hmic').innerText=ic;}
function toggleSpeaker(){document.getElementById('remoteAudio').volume=1; document.getElementById('hspk').classList.toggle('on');}
const kp=document.getElementById('keypad'); [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].forEach(k=>{const d=document.createElement('div'); d.className='key'; d.innerHTML='<b>'+k[0]+'</b><span>'+k[1]+'</span>'; if(k[0]!=='#') d.onclick=()=>document.getElementById('callId').value+=k[0]; else d.onclick=()=>document.getElementById('callId').value=document.getElementById('callId').value.slice(0,-1); kp.appendChild(d);});
</script>
</body>
</html>
